<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO郷さんぽ 画像ジェネレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111111;
    --paper:#ffffff;
    --line:#e5e5e5;
    --muted:#7a7a7a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:#f4f4f4;
    color:var(--ink);
    font-family:"Noto Sans JP", sans-serif;
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:40px 24px 80px;
    display:grid;
    grid-template-columns:360px 1fr;
    gap:40px;
  }
  @media (max-width:860px){
    .wrap{grid-template-columns:1fr;}
  }
  header{
    max-width:1100px;
    margin:0 auto;
    padding:32px 24px 0;
  }
  h1{
    font-size:20px;
    font-weight:700;
    letter-spacing:0.02em;
    margin:0 0 4px;
  }
  .sub{
    color:var(--muted);
    font-size:13px;
    margin:0;
  }
  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:4px;
    padding:24px;
    height:fit-content;
  }
  label{
    display:block;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.04em;
    margin-bottom:8px;
    color:var(--ink);
  }
  .field{
    margin-bottom:24px;
  }
  .dropzone{
    border:1.5px dashed #bbb;
    border-radius:4px;
    padding:20px;
    text-align:center;
    cursor:pointer;
    font-size:13px;
    color:var(--muted);
    transition:border-color .15s;
  }
  .dropzone:hover{ border-color: var(--ink); }
  .dropzone.has-image{
    color:var(--ink);
    border-style:solid;
  }
  input[type="file"]{ display:none; }
  input[type="date"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:4px;
    font-family:"Noto Sans JP", sans-serif;
    font-size:14px;
    color:var(--ink);
    background:#fff;
  }
  input[type="date"]:focus{
    outline:2px solid var(--ink);
    outline-offset:1px;
  }
  textarea{
    width:100%;
    min-height:120px;
    padding:12px;
    border:1px solid #ccc;
    border-radius:4px;
    font-family:"Noto Sans JP", sans-serif;
    font-size:14px;
    resize:vertical;
    line-height:1.6;
  }
  textarea:focus, .dropzone:focus{
    outline:2px solid var(--ink);
    outline-offset:1px;
  }
  .count{
    text-align:right;
    font-size:11px;
    color:var(--muted);
    margin-top:4px;
  }
  button{
    width:100%;
    padding:14px;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:4px;
    font-family:"Noto Sans JP", sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.02em;
    cursor:pointer;
  }
  button:disabled{
    background:#bbb;
    cursor:not-allowed;
  }
  .preview-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .canvas-shell{
    background:#000;
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 4px 24px rgba(0,0,0,0.15);
    width:100%;
    max-width:340px;
  }
  canvas{
    display:block;
    width:100%;
    height:auto;
  }
  .hint{
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }
</style>
</head>
<body>

<header>
  <h1>NEO郷さんぽ 画像ジェネレーター</h1>
  <p class="sub">写真と「なぜ」を入力すると、Instagram投稿用の画像（1080×1920）を作成します</p>
</header>

<div class="wrap">
  <div class="panel">
    <div class="field">
      <label for="fileInput">写真</label>
      <div class="dropzone" id="dropzone" tabindex="0">クリックして写真を選択</div>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="field">
      <label for="dateInput">日付</label>
      <input type="date" id="dateInput">
    </div>

    <div class="field">
      <label for="textInput">なぜ（テキスト）</label>
      <textarea id="textInput" placeholder="「なぜそれに惹かれたのか？」&NewLine; 採集したときに感じた気持ちを書いてください（3行程度）" maxlength="90"></textarea>
      <div class="count"><span id="charCount">0</span>/90</div>
    </div>

    <button id="downloadBtn" disabled>画像をダウンロード</button>
  </div>

  <div class="preview-col">
    <div class="canvas-shell">
      <canvas id="canvas" width="1080" height="1920"></canvas>
    </div>
    <p class="hint">プレビュー（実寸 1080×1920px）</p>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('fileInput');
const dropzone = document.getElementById('dropzone');
const dateInput = document.getElementById('dateInput');
const textInput = document.getElementById('textInput');
const charCount = document.getElementById('charCount');
const downloadBtn = document.getElementById('downloadBtn');

// デフォルトは生成する日（今日）
function todayString() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + mm + '-' + dd;
}
dateInput.value = todayString();
dateInput.addEventListener('input', render);

const TITLE = '#NEO郷さんぽ';
let photoImg = null;

const W = 1080, H = 1920;
const MARGIN_X = 100;
const CONTENT_W = W - MARGIN_X * 2; // 880

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') fileInput.click();
});

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      photoImg = img;
      dropzone.textContent = file.name;
      dropzone.classList.add('has-image');
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
});

textInput.addEventListener('input', () => {
  charCount.textContent = textInput.value.length;
  render();
});

function wrapText(context, text, maxWidth) {
  // 日本語想定：文字単位で改行判定（既存の改行はそのまま尊重）
  const paragraphs = text.split('\n');
  const lines = [];
  paragraphs.forEach(paragraph => {
    if (paragraph === '') { lines.push(''); return; }
    let current = '';
    for (const ch of paragraph) {
      const test = current + ch;
      if (context.measureText(test).width > maxWidth && current !== '') {
        lines.push(current);
        current = ch;
      } else {
        current = test;
      }
    }
    if (current) lines.push(current);
  });
  return lines;
}

function drawPhotoSquare(img, x, y, size) {
  const sw = img.width, sh = img.height;
  const side = Math.min(sw, sh);
  const sx = (sw - side) / 2;
  const sy = (sh - side) / 2;
  ctx.drawImage(img, sx, sy, side, side, x, y, size, size);
}

function formatDate() {
  const val = dateInput.value; // "YYYY-MM-DD"
  if (!val) return '';
  const [y, m, d] = val.split('-').map(Number);
  const mm = String(m).padStart(2, '0');
  const dd = String(d).padStart(2, '0');
  return y + '.' + mm + '.' + dd;
}

function drawRoundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBackground() {
  // ベースの下地色（画像読み込み前やはみ出し部分の保険）
  ctx.fillStyle = '#efefef';
  ctx.fillRect(0, 0, W, H);

  if (photoImg) {
    // 高さ基準で拡大し、横方向は中央配置（はみ出た分はクロップ）
    const scale = H / photoImg.height;
    const drawW = photoImg.width * scale;
    const drawH = H;
    const dx = (W - drawW) / 2;

    ctx.save();
    ctx.filter = 'blur(100px)';
    ctx.drawImage(photoImg, dx, 0, drawW, drawH);
    ctx.restore();

    // ボケた背景の上にごく薄い白を重ねて可読性を確保
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(0, 0, W, H);
  }
}

function render() {
  // 背景（添付写真を高さ基準で拡大配置し、ボカシを適用）
  drawBackground();
  ctx.fillStyle = '#111111';
  ctx.textBaseline = 'top';

  // ---- カード内の要素サイズ ----
  const TITLE_FONT = '700 50px "Noto Sans JP"';
  const TITLE_LINE_H = 60;
  const GAP_TITLE_CARD = 56;

  const CARD_PAD_SIDE = 100;
  const CARD_PAD_TOP = 110;
  const CARD_PAD_BOTTOM = 96;
  const CARD_RADIUS = 4;

  const PHOTO_SIZE = 760;
  const GAP_PHOTO_TEXT = 68;

  const TEXT_FONT = '400 42px "Noto Sans JP"';
  const TEXT_LINE_H = 60;
  const ASSUMED_LINES = 3;
  const GAP_TEXT_DATE = 56;

  const DATE_FONT = '400 34px "Noto Sans JP"';
  const DATE_LINE_H = 44;

  // 本文を先に折り返し計算
  ctx.font = TEXT_FONT;
  const text = textInput.value.trim();
  const textLines = text ? wrapText(ctx, text, PHOTO_SIZE) : [];
  const lineCount = Math.max(textLines.length, ASSUMED_LINES);
  const textBlockH = lineCount * TEXT_LINE_H;

  const CARD_W = PHOTO_SIZE + CARD_PAD_SIDE * 2;
  const CARD_H = CARD_PAD_TOP + PHOTO_SIZE + GAP_PHOTO_TEXT + textBlockH +
                 GAP_TEXT_DATE + DATE_LINE_H + CARD_PAD_BOTTOM;
  const CARD_X = (W - CARD_W) / 2;

  // ---- 全体を上下中央に配置してバランスを取る ----
  const totalH = TITLE_LINE_H + GAP_TITLE_CARD + CARD_H;
  const startY = Math.max(80, (H - totalH) / 2);

  let cursorY = startY;

  // タイトル（カード右端に合わせて右揃え）
  ctx.font = TITLE_FONT;
  ctx.textAlign = 'right';
  ctx.fillStyle = '#111111';
  ctx.fillText(TITLE, CARD_X + CARD_W, cursorY);
  cursorY += TITLE_LINE_H + GAP_TITLE_CARD;

  // カード（白背景・角丸・ドロップシャドウ）
  const cardY = cursorY;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.18)';
  ctx.shadowBlur = 40;
  ctx.shadowOffsetY = 12;
  ctx.fillStyle = '#ffffff';
  drawRoundedRect(CARD_X, cardY, CARD_W, CARD_H, CARD_RADIUS);
  ctx.fill();
  ctx.restore();

  // 写真（正方形トリミング）
  const photoX = CARD_X + CARD_PAD_SIDE;
  const photoY = cardY + CARD_PAD_TOP;
  if (photoImg) {
    drawPhotoSquare(photoImg, photoX, photoY, PHOTO_SIZE);
  } else {
    ctx.fillStyle = '#ececec';
    ctx.fillRect(photoX, photoY, PHOTO_SIZE, PHOTO_SIZE);
    ctx.fillStyle = '#bbbbbb';
    ctx.font = '400 30px "Noto Sans JP"';
    ctx.textAlign = 'center';
    ctx.fillText('写真を選択してください', photoX + PHOTO_SIZE / 2, photoY + PHOTO_SIZE / 2);
    ctx.fillStyle = '#111111';
  }

  // テキスト（なぜ）：カード内左揃え
  const textY = photoY + PHOTO_SIZE + GAP_PHOTO_TEXT;
  if (textLines.length) {
    ctx.font = TEXT_FONT;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#222222';
    let ty = textY;
    textLines.forEach(line => {
      ctx.fillText(line, photoX, ty);
      ty += TEXT_LINE_H;
    });
    ctx.fillStyle = '#111111';
  }

  // 日付（カード内右揃え・下寄せ）
  const dateY = cardY + CARD_H - CARD_PAD_BOTTOM - DATE_LINE_H;
  ctx.font = DATE_FONT;
  ctx.textAlign = 'right';
  ctx.fillStyle = '#999999';
  ctx.fillText(formatDate(), photoX + PHOTO_SIZE, dateY);
  ctx.fillStyle = '#111111';

  downloadBtn.disabled = !photoImg;
}

downloadBtn.addEventListener('click', () => {
  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'neo_gou_sanpo.png';
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/png');
});

// フォント読み込み完了後に初期描画
document.fonts.load('700 56px "Noto Sans JP"').then(() => document.fonts.load('400 42px "Noto Sans JP"')).then(render);
window.addEventListener('load', () => {
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(render);
  } else {
    render();
  }
});
render();
</script>

</body>
</html>
