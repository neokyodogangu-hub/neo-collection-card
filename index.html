<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO郷さんぽ 画像ジェネレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>NEO郷さんぽ 画像ジェネレーター</h1>
  <p class="sub">写真と「なぜ」を入力すると、Instagram投稿用の画像（1080×1920）を作成します</p>
</header>

<div class="wrap">
  <div class="panel">
    <div class="field">
      <label for="fileInput">写真</label>
      <div class="dropzone" id="dropzone" tabindex="0">クリックして写真を選択</div>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="field">
      <label for="dateInput">日付</label>
      <input type="date" id="dateInput">
    </div>

    <div class="field">
      <label for="textInput">なぜ（テキスト）</label>
      <textarea id="textInput" placeholder="採集したときに感じた「なぜ」を書いてください（3行程度）" maxlength="90"></textarea>
      <div class="count"><span id="charCount">0</span>/90</div>
    </div>

    <button id="downloadBtn" disabled>画像をダウンロード</button>
    <button id="downloadCardBtn" class="secondary" disabled>カードのみダウンロード</button>
  </div>

  <div class="preview-col">
    <div class="canvas-shell">
      <canvas id="canvas" width="1080" height="1920"></canvas>
    </div>
    <p class="hint">プレビュー（実寸 1080×1920px）</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
